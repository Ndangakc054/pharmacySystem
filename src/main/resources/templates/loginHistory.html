   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='settings')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Historique des connexions</h1>
            <div class="insigths">
            </div>
            <!-----------------END OF FORM------------------>
            <div class="recent-orders">
               <div class="title-with-pack">
                  <a th:href="@{/settings}" class="back-icon">
                     <span><img src="/imgs/arrow_back.svg" alt=""></span>
                  </a>
               </div>
            </div>
            <div class="history-container">
               <table class="table">
                  <thead>
                     <tr>
                        <th>IdAction</th>
                        <th>Utilisateur</th>
                        <th>Date/Heure de connexion</th>
                        <th>Date/Heure de deconnexion</th>
                        <th>Temps de connexion</th>
                     </tr>
                  </thead>
                  <tbody>
                     <tr th:each="log : ${historyList}">
                        <td th:text="${log.idLogin}"></td>
                        <td th:text="${log.user.nomUtilisateur}"></td>
                        <td th:text="${#temporals.format(log.loginTime, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                           <span th:if="${log.logoutTime != null}" th:text="${#temporals.format(log.logoutTime, 'dd/MM/yyyy HH:mm')}">
                           </span>
                           <span th:if="${log.logoutTime == null}">NULL</span>
                        </td>
                        <td>
                           <span th:if="${log.connectionDuration != null}" th:text="${utils.formatDuration(log.connectionDuration)}">
                           </span>
                           <span th:if="${log.connectionDuration == null}">NULL</span>
                        </td>
                        <!--<td th:if="${log.logoutTime != null}" th:text="${#temporals.format(log.logoutTime, 'dd/MM/yyyy HH:mm')}"></td>
                                       <td th:if="${log.connectionDuration != null}" th:text="${utils.formatDuration(log.connectionDuration)}"></td>-->
                     </tr>
                  </tbody>
               </table>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
         </div>
      </div>
      <script src="/js/main.js" defer></script>
   </body>
   </html>
