   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='stock')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Expiration des médicaments</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="insigths"></div>
            <div class="recent-orders">
               <div class="title-with-pack">
                  <a th:href="@{/stock}" class="back-icon">
                     <span><img src="/imgs/arrow_back.svg" alt=""></span>
                  </a>
               </div>
            </div>
            <div class="stock-container">
               <div class="search-container">
                  <span class="search-icon" onclick="toggleSearch()"><img src="/imgs/search.svg"></span>
                     <input type="search" id="searchInput" class="search-input" placeholder="Recherchez ici..." onkeyup="filterTable()">
               </div>
            </div>

            <div class="expiry-container">
               <div class="title-with-pack">
                  <a th:href="@{/stock}" class="back-icon">
                  </a>
               </div>
               <div class="filter-container">
                  <div class="table-title">
                     <h2>Listes des médicaments</h2>
                  </div>

                  <div class="status-filter">
                     <select id="statusSelect" onchange="filterByStatus()" class="form-control">
                        <option value="all">Tous les statuts</option>
                        <option value="URGENT">🔴 Urgent (Expiré)</option>
                        <option value="ATTENTION">🟠 Attention (Bientôt)</option>
                        <option value="NORMAL">🟢 Normal</option>
                     </select>
                  </div>
               </div>
               <table>
                  <thead>
                     <tr>
                        <th>ID</th>
                        <th>Médicament</th>
                        <th>Quantité</th>
                        <th>Date Expiration</th>
                        <th>Statut</th>
                        <th>Temps Restant</th>
                        <th>Jours Restants</th>
                     </tr>
                  </thead>
                  <tbody id="tableBody">
                     <tr th:each="med : ${listExpiry}">
                        <td th:text="${med.id}"></td>
                        <td class="name" th:text="${med.drugName}"></td>
                        <td th:text="${med.quantity}"></td>
                        <td th:text="${med.expirationDate != null} ? ${#temporals.format(med.expirationDate, 'dd/MM/yyyy')} : 'N/A'">
                        </td>
                        <td>
                           <span class="status-icon"
                              th:classappend="${med.status == 'URGENT' ? 'status-urgent' : (med.status == 'ATTENTION' ? 'status-warning' : 'status-normal')}">
                              &nbsp;
                           </span>
                           <span th:text="${med.status}"></span>
                        </td>
                        <td th:text="${med.remainingTime}"></td>
                        <td th:text="${med.daysRemaining}"></td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>
      <script src="/js/main.js" defer></script>
   </body>
   </html>
