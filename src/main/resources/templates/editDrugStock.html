   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ====MATERIAL ICON=== -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp"
    rel="stylesheet">
    <!-----BOOTSTRAP
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">---->
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="/htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='stock')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Stock</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="insigths">
               
            </div>
         <!-----------------FORM------------------>
            <div class="recent-orders">
               <div  id="addDrugForm" class="add-form">
                    <div class="form-content">
                     <div class="title-with-pack">
                        <a th:href="@{/stock}" class="back-icon">
                           <span><img src="/imgs/arrow_back.svg" alt=""></span>
                        </a>
                        <!--<h2>Ajouter un nouveau médicaments</h2>-->
                     </div>
                       <form th:action="@{/stock/update}" method="post" th:object="${stock}" id="drugForm">
                           <!-- Champ caché pour transmettre l'Id -->
                           <input type="hidden"  th:field="*{idStock}">
                           <!-- Champ caché pour le batch ID -->
                           <!--<input type="hidden" th:field="*{batch}">-->

                          <div class="form-group">
                           <label>Médicament:</label>
                           <select name="drugId"  required>
                               <option value="">-- Sélectionnez --</option>
                               <option th:each="drug : ${listDrugs}"
                                       th:value="${drug.idDrug}"
                                       th:text="${drug.nameDrug}"
                                       th:selected="${drug.idDrug == stock.drug.idDrug}">
                               </option>
                           </select>
                          </div>
                          <div class="form-group">
                             <label for="drugQuantity">Quantité:</label>
                             <input type="number" name="drugQuantity" id="drugQuantity" step="1" min="0" max="200" th:field="*{quantity}" maxlength="11" required>
                          </div>
                          <div class="form-group">
                             <label for="drugDate">Date d'expiration:</label>
                             <input type="date" name="drugDate" id="drugDate" th:field="*{dateExpirationFormatted}" required>
                          </div>
                          <div class="form-group">
                             <label for="drugUnitPrice">Prix Unitaire:</label>
                             <input type="text" name="drugUnitPrice" id="drugUnitPrice" th:field="*{prixUnitaire}"required>
                          </div>
                          <div class="form-group">
                             <label for="drugTotalPrice">Prix Total:</label>
                             <input type="text" name="drugTotalPrice" id="drugTotalPrice" th:field="*{prixTotal}" required>
                          </div>
                          <div class="form-group">
                             <label for="dateEntry">Date d'entrée:</label>
                             <input type="date" name="dateEntry" id="dateEntry" th:field="*{dateEntreeFormatted}" required>
                          </div>
                          <div class="submitBtn">
                             <button type="submit" id="submit-btn">Modifier</button>
                          </div>
                       </form>
                    </div>
                 </div>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>
      <!-- Modal -->
      <div id="modal" class="modal" 
      data-status="[[${status} ?: 'null']]" 
      data-message="[[${message} ?: '']]">
     <div class="modal-content">
         <span class="close" id="close-modal">&times;</span>
         <p id="modal-message"></p>
     </div>
     </div>
 
      <!-- Récuperation des données depuis thymeleaf -->
      <!--<div th:if="${status}" th:data-status="${status}" th:data-message="${message}"></div>-->
      <!-- Cette div sera ajoutée via RedirectAttributes -->
      <!--<div id="flash-data" th:if="${status != null and message != null}" th:data-status="${status}" th:data-message="${message}" style="display: none;">
         
       </div>--> 
      <!--<script src="./assets/js/orders.js"></script>-->
      <script src="/js/main.js" defer></script>
