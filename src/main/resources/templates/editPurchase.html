   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie WUTANG</title>
    <!-- ====MATERIAL ICON=== -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp"
    rel="stylesheet">
    <!-----BOOTSTRAP
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">---->
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="/htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <aside>
            <div class="top">
               <div class="logo">
                  <img src="/imgs/pharmacy.png">
                  <h2>PHARMACIE<span class="danger">HUMANOPHAR</span></h2>
               </div>
            </div>
            <div class="close" id="close-btn">
               <span class="material-icons-sharp">close</span>
            </div>
            <div class="sidebar">
               <a th:href="@{/home}">
                  <span><img src="/imgs/grid_view.svg"></span>
                  <h3>Accueil</h3>
               </a>
               
               <a th:href="@{/drugs}">
                  <span><img src="/imgs/medication_liquid.svg"></span>
                  <h3>Médicaments</h3>
               </a>
   
               <a th:href="@{/stock}">
                  <span><img src="/imgs/inventory_2.svg"></span>
                  <h3>Inventaire</h3>
               </a>
   
               <a th:href="@{/sales}">
                  <span><img src="/imgs/paid.svg"></span>
                  <h3>Ventes</h3>
               </a>
   
               <a th:href="@{/purchases}" class="active">
                  <span><img src="/imgs/inventory.svg"></span>
                  <h3>Ravitaillement</h3>
               </a>
   
               <a th:href="@{/orders}">
                  <span><img src="/imgs/fact_check.svg"></span>
                  <h3>commandes</h3>
               </a>
   
               <a th:href="@{/suppliers}">
                  <span><img src="/imgs/person_outline.svg"></span>
                  <h3>Fournisseurs</h3>
               </a>
   
               <a th:href="@{/settings}">
                  <span><img src="/imgs/settings.svg"></span>
                  <h3>Paramètres</h3>
               </a>
   
               <form th:action="@{/logout}" method="post">
                  <button type="submit">
                     <span><img src="/imgs/logout.svg"></span>
                     <h3>Se déconnecter</h3>
                  </button>
               </form>
            </div>
         </aside>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Achats</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="insigths">
         
            </div>
            <!-----------------FORM------------------>
            <div class="recent-orders">
               <div id="addDrugForm" class="add-form">
                  <div class="form-content">
                     <div class="title-with-pack">
                        <a th:href="@{/purchases}" class="back-icon">
                           <span><img src="/imgs/arrow_back.svg" alt=""></span>
                        </a>
                        <!--<h2>Ajouter un nouveau médicaments</h2>-->
                     </div>
                     <form th:action="@{/purchases/update}" method="post" th:object="${purchase}" id="drugForm">
                        <!-- Champ caché pour transmettre l'Id -->
                        <input type="hidden" th:field="*{idPurchase}">
                        <div class="form-group">
                           <label for="drugName"> Médicaments:</label>
                           <select name="drugId" required>
                              <option th:each="drug : ${listDrugs}" 
                                      th:value="${drug.idDrug}" 
                                      th:text="${drug.nameDrug}"
                                      th:selected="${purchase.drug != null and drug.idDrug == purchase.drug.idDrug}">
                              </option>
                           </select>
                        </div>
                        <div class="form-group">
                           <label for="drugName"> Fournisseurs:</label>
                           <select name="supplierId" required>
                              <option th:each="supplier : ${listSuppliers}" 
                                       th:value="${supplier.idSupplier}"
                                       th:text="${supplier.nomFournisseur}"
                                       th:selected="${purchase.supplier != null and supplier.idSupplier == purchase.supplier.idSupplier}">
                              </option>
                           </select>
                        </div>
                        <div class="form-group">
                           <label for="drugQuantity">Quantité:</label>
                           <input type="text" name="drugQuantity" id="drugQuantity" th:field="*{quantity}" maxlength="11"
                              required>
                        </div>
                        <div class="form-group">
                           <label for="drugUnitPrice">Prix d'achat unitaire:</label>
                           <input type="text" name="drugUnitPrice" id="drugUnitPrice" th:field="*{prixAchatUnitaire}" required>
                        </div>
                        <div class="form-group">
                           <label for="drugTotalPrice">Prix d'achat total:</label>
                           <input type="text" name="drugTotalPrice" id="drugTotalPrice" th:field="*{prixAchatTotal}" readonly>
                        </div>
                        <div class="form-group">
                           <label for="drugDate">Date d'achat:</label>
                           <input type="date" name="purchaseDate" id="purchaseDate" th:field="*{dateAchatFormatted}" required>
                        </div>
                        <div class="form-group">
                           <label for="drugDate">Date d'expiration:</label>
                           <input type="date" name="expirationDate" id="expirationDate" th:field="*{dateExpirationFormatted}" required>
                        </div>
                        <div class="submitBtn">
                           <button type="submit" id="submit-btn">Modifier</button>
                        </div>
                     </form>
                  </div>
               </div>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>
      <!-- Modal -->
      <div id="modal" class="modal" 
      data-status="[[${status} ?: 'null']]" 
      data-message="[[${message} ?: '']]">
     <div class="modal-content">
         <span class="close" id="close-modal">&times;</span>
         <p id="modal-message"></p>
     </div>
     </div>
 
      <!-- Récuperation des données depuis thymeleaf -->
      <!--<div th:if="${status}" th:data-status="${status}" th:data-message="${message}"></div>-->
      <!-- Cette div sera ajoutée via RedirectAttributes -->
      <!--<div id="flash-data" th:if="${status != null and message != null}" th:data-status="${status}" th:data-message="${message}" style="display: none;">
         
       </div>--> 
      <!--<script src="./assets/js/orders.js"></script>-->
      <script src="/js/main.js" defer></script>
      <!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>-->
   </body>
   </html>
