   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="/htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='sales')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Modification d'une vente</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="insigths">
         
            </div>
            <!-----------------FORM------------------>
            <div class="recent-orders">
               <div id="addDrugForm" class="add-form">
                  <div class="form-content">
                     <div class="title-with-pack">
                        <a th:href="@{/recentSales}" class="back-icon">
                           <span><img src="/imgs/arrow_back.svg" alt=""></span>
                        </a>
                     </div>
                     <form th:action="@{/sales/update}" method="post" th:object="${sale}" id="drugForm">
                        <!-- Champ caché pour l'ID -->
                        <input type="hidden" name="idSale" th:field="*{idSale}">
         
                        <div class="form-group">
                           <label>Nom:</label>
                           <input type="text" th:value="*{drug.nameDrug}" class="form-control" readonly>
                        </div>
         
                        <div class="form-group">
                           <label for="quantity">Quantité:</label>
                           <input type="number" name="quantity" id="quantity" th:field="*{quantity}" min="1" step="1" required
                              class="form-control">
                        </div>
         
                        <div class="form-group">
                           <label for="prixUnitaire">Prix Unitaire:</label>
                           <input type="number" name="prixUnitaire" id="prixUnitaire" th:field="*{prixUnitaire}" min="0.01"
                              step="0.01" required class="form-control">
                        </div>
         
                        <div class="form-group">
                           <label for="prixTotal">Prix Total:</label>
                           <input type="text" name="prixTotal" id="prixTotal" th:field="*{prixTotal}" readonly
                              class="form-control">
                        </div>
         
                        <div class="submitBtn">
                           <button type="submit" id="submit-btn">Modifier</button>
                        </div>
                     </form>
                  </div>
               </div>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p>Hey, <b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>
      <!-- Modal -->
      <div id="modal" class="modal" 
      data-status="[[${status} ?: 'null']]" 
      data-message="[[${message} ?: '']]">
     <div class="modal-content">
         <span class="close" id="close-modal">&times;</span>
         <p id="modal-message"></p>
     </div>
     </div>
 
      <!-- Récuperation des données depuis thymeleaf -->
      <!--<div th:if="${status}" th:data-status="${status}" th:data-message="${message}"></div>-->
      <!-- Cette div sera ajoutée via RedirectAttributes -->
      <!--<div id="flash-data" th:if="${status != null and message != null}" th:data-status="${status}" th:data-message="${message}" style="display: none;">
         
       </div>--> 
      <!--<script src="./assets/js/orders.js"></script>-->
      <script src="/js/main.js" defer></script>

   </body>
   </html>
