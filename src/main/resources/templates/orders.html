   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ====MATERIAL ICON=== -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp"
    rel="stylesheet">
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='orders')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Réquisition des médicaments</h1>
            <div class="date">
               <input type="date">
            </div>

            <div class="stock-container">
               <div class="search-container">
                  <span class="search-icon" onclick="toggleSearch()"><img src="/imgs/search.svg" alt=""></span>
                     <input type="search" id="searchInput" class="search-input" placeholder="Recherchez ici..." onkeyup="filterTable()">
               </div>
               <table>
                  <thead>
                     <tr>
                        <th>Nom</th>
                        <th>Quantité</th>
                     </tr>
                  </thead>
                  <tbody id="tableBody">
                     <th:block th:each="stock :${listStock}">
                        <tr>
                           <td class="name">[[${stock.drug.nameDrug}]]</td>
                           <td>[[${stock.quantity}]]</td>
                           <td>
                              <span class="add-icon" onclick="addToPurchaseList(this)"><img src="/imgs/add_circle_outline.svg"></span>
                           </td>
                           <td>
                              <span class="cancel-icon" onclick="removeFromPurchaseListByLeft(this)"><img src="/imgs/remove_circle_outline.svg"></span>
                           </td>
                        </tr>
                     </th:block>
                  </tbody>
               </table>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
            <!-- END OF TOP -->
            <!-- ORDERS -->
            <div class="orders-container">
               <h2>Fiche de réquisition</h2>
               <form  id="ordersForm" >
                  <table>
                     <thead>
                        <tr>
                           <th>Name</th>
                           <th>Quantity</th>
                        </tr>
                     </thead>
                     <tbody id="orders-body">
                         <!-Place for drugs added-->
                         
                     </tbody>
                  </table>
                  <div class="orders-buttons">
                     <button type="button" id="validate-file" onclick="return confirm('Voulez-vous vraiment valider ce fiche de réquisition ?')">
                        <span><img src="/imgs/check_circle.svg"></span>
                           <h3>Valider</h3>
                     </button>
                  </div>
               </form>
            </div>
            <div class="recent-updates"></div>
         </div>
      </div>>
      <script th:src="@{/js/main.js}"></script>
   </body>
   </html>
