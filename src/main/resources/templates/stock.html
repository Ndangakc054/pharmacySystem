<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pharmacie HUMANOPHAR</title>
   <!-- ==== STYLESHEET === -->
   <link rel="stylesheet" href="/css/style.css">
   <link href="htp" rel="stylesheet">
</head>

<body>
   <div class="container">
      <div th:replace="~{fragments :: sidebarAdmin(activeLink='stock')}"></div>
      <!---------------------- END OF ASIDE -------------------------->
      <main>
         <h1>Stock</h1>
         <div class="date">
            <input type="date">
         </div>
         <div class="stock-container">
            <div class="search-container">
               <span class="search-icon" onclick="toggleSearch()"><img src="/imgs/search.svg"></span>
               <input type="search" id="searchInput" class="search-input" placeholder="Recherchez ici..."
                  onkeyup="filterTable()">
            </div>
         </div>
   
         <!--  ADD BUTTON -->
         <div class="button-container">
            <button class="action-button">
               <a th:href="@{/addDrugStock}">Ajouter</a>
            </button>
         </div>


   
         <div class="recent-orders">
            <div class="import-container" style="margin-bottom: 20px;">
               <form th:action="@{/stock/import}" method="post" enctype="multipart/form-data">
                  <label for="file">Importer l'inventaire (Excel) :</label>
                  <input type="file" name="file" id="file" accept=".xlsx, .xls" required>
                  <button type="submit" class="action-button">Démarrer l'importation</button>
               </form>
            </div>

            <div class="filter-container">
               <div class="table-title">
                  <h2>Listes des médicaments</h2>
               </div>
               <button class="action-button">
                  <a th:href="@{/stock/export/excel}">Générer le fichier de l'inventaire</a>
               </button>

            </div>
            <table>
               <thead>
                  <tr>
                     <th>Nom</th>
                     <th>Quantité</th>
                     <th>Date expiration</th>
                     <th>Prix unitaire</th>
                     <th>Prix total</th>
                     <th>Date d'entrée</th>
                     <th></th>
                     <th></th>
                  </tr>
               </thead>
               <tbody id="tableBody">
                  <th:block th:each="stock :${listStock}">
                     <tr>
                        <td class="name">[[${stock.drug.nameDrug}]]</td>
                        <td>[[${stock.quantity}]]</td>
                        <td th:text="${#temporals.format(stock.dateExpiration, 'dd/MM/yyyy')}"></td>
                        <td>[[${stock.prixUnitaire}]]</td>
                        <td>[[${stock.prixTotal}]]</td>
                        <td th:text="${#temporals.format(stock.dateEntree, 'dd/MM/yyyy')}"></td>
                        <td>
                           <a th:href="@{|/stock/edit/${stock.idStock}|}">
                              <span class="edit-icon">Éditer</span>
                           </a>
                        </td>
                        <td>
                           <a th:href="@{|/stock/delete/${stock.idStock}|}"
                              onclick="return confirm('Voulez-vous vraiment supprimer ce produit dans le stock ?')">
                              <span class="delete-icon">Supprimer</span>
                           </a>
                        </td>
                  </th:block>
               </tbody>
            </table>
         </div>
      </main>
      <!---------------------- END OF MAIN -------------------------->
      <div class="rigth">
         <div class="top">
            <button id="menu-btn">
               <span class="material-icons-sharp">menu</span>
            </button>
            <div class="theme-toggler">
               <span class="active"><img src="/imgs/light_mode.svg"></span>
               <span><img src="/imgs/dark_mode.svg"></span>
            </div>
            <div class="profile">
               <div class="info">
                  <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                  <small class="text-muted" th:text="${loggedUser.type}">Role</small>
               </div>
               <div class="profile-photo">
                  <img src="/imgs/profile-1.jpg" alt="">
               </div>
            </div>
         </div>
         <!-- EXPIRY-LINK -->
         <div link-container>
            <div>
               <a th:href="@{/expiry}">
                  <span><img src="/imgs/warning.svg" alt=""></span>
                  <h3>Expiration des médicaments</h3>
               </a>
            </div>
         </div>
         <div class="sales-analytics">
            <div class="item offline">
               <div class="right">
                  <div class="info">
                     <h2>Stock inventorié</h2>
                     <h2>
                        <span th:text="${totalInventory}">0.00</span>
                        <span class="danger">Fbu</span>
                     </h2>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>

   <div th:if="${message}" id="notification-modal" class="modal-notification"
        th:classappend="${status == 'success' ? 'success' : 'error'}">

      <div class="modal-content">
        <span class="icon">
            <i class="material-icons-sharp" th:text="${status == 'success' ? 'message' : 'error'}"></i>
        </span>

         <span class="msg-text" th:text="${message}"></span>

         <div class="progress-bar"></div>

         <span class="close-btn">&times;</span>
      </div>
   </div>
   <script src="/js/main.js" defer></script>
</body>

</html>
