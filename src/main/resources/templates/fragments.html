<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebarAdmin(activeLink)">

    <div class="top">
        <div class="logo">
            <img src="/imgs/pharmacy.png">
            <h2>PHARMACIE<span class="danger">HUMANOPHAR</span></h2>
        </div>
        <div class="close" id="close-btn">
            <span class="material-icons-sharp">close</span>
        </div>
    </div>

    <div class="sidebar">

        <a th:href="@{/home}"
           th:classappend="${activeLink == 'home'} ? 'active' : ''">
            <span><img src="/imgs/grid_view.svg"></span>
            <h3>Accueil</h3>
        </a>

        <a th:href="@{/drugs}"
           th:classappend="${activeLink == 'drugs'} ? 'active' : ''">
            <span><img src="/imgs/medication_liquid.svg"></span>
            <h3>Médicaments</h3>
        </a>

        <a th:href="@{/stock}"
           th:classappend="${activeLink == 'stock'} ? 'active' : ''">
            <span><img src="/imgs/inventory_2.svg"></span>
            <h3>Inventaire</h3>
        </a>

        <a th:href="@{/sales}"
           th:classappend="${activeLink == 'sales'} ? 'active' : ''">
            <span><img src="/imgs/paid.svg"></span>
            <h3>Ventes</h3>
        </a>

        <a th:href="@{/purchases}"
           th:classappend="${activeLink == 'purchases'} ? 'active' : ''">
            <span><img src="/imgs/inventory.svg"></span>
            <h3>Ravitaillement</h3>
        </a>

        <a th:href="@{/orders}"
           th:classappend="${activeLink == 'orders'} ? 'active' : ''">
            <span><img src="/imgs/fact_check.svg"></span>
            <h3>commandes</h3>
        </a>

        <a th:href="@{/suppliers}"
           th:classappend="${activeLink == 'suppliers'} ? 'active' : ''">
            <span><img src="/imgs/person_outline.svg"></span>
            <h3>Fournisseurs</h3>
        </a>

        <a th:href="@{/settings}"
           th:classappend="${activeLink == 'settings'} ? 'active' : ''">
            <span><img src="/imgs/settings.svg"></span>
            <h3>Paramètres</h3>
        </a>

        <form th:action="@{/logout}" method="post">
            <button type="submit">
                <span><img src="/imgs/logout.svg"></span>
                <h3>Se déconnecter</h3>
            </button>
        </form>
    </div>
</aside>

        </form>
    </div>
</aside>

</body>
</html>
