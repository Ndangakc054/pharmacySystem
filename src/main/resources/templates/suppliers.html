   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>->
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='suppliers')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Fournisseurs</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="insigths">    
            </div>

            <div class="stock-container">
               <div class="search-container">
                  <span class="search-icon" onclick="toggleSearch()"><img src="/imgs/search.svg"></span>
                     <input type="search" id="searchInput" class="search-input" placeholder="Recherchez ici..." onkeyup="filterTable()">
               </div>
            </div>

            <!--  ADD BUTTON -->
            <div class="button-container">
               <button class="action-button">
                  <a th:href="@{/addSupplier}">Ajouter</a>
               </button>
            </div>

            <div class="recent-orders">
               <h2>Liste des fournisseurs</h2>
               <table>
                  <thead>
                     <tr>
                        <th>Nom</th>
                        <th>NIF</th>
                        <th>Adresse</th>
                        <th>Email</th>
                        <th></th>
                        <th></th>
                     </tr>
                  </thead>
                  <tbody id="tableBody">
                     <th:block th:each="supplier :${listSuppliers}">
                        <tr>
                           <td class="name">[[${supplier.nomFournisseur}]]</td>
                           <td>[[${supplier.nif}]]</td>
                           <td>[[${supplier.adresse}]]</td>
                           <td>[[${supplier.email}]]</td>
                           <td>
                              <a th:href="@{|/suppliers/edit/${supplier.idSupplier}|}">
                                 <span class="edit-icon">Editer</span>
                              </a>
                           </td>
                           <td>
                              <a th:href="@{|/suppliers/delete/${supplier.idSupplier}|}"
                                 onclick="return confirm('Voulez-vous vraiment supprimer ce fournisseur ?')">
                                 <span class="delete-icon">Supprimer</span>
                              </a>
                           </td>
                        </tr>
                     </th:block>
                  </tbody>
               </table>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>

      <div th:if="${message}" id="notification-modal" class="modal-notification"
           th:classappend="${status == 'success' ? 'success' : 'error'}">

         <div class="modal-content">
        <span class="icon">
            <i class="material-icons-sharp" th:text="${status == 'success' ? 'message' : 'error'}"></i>
        </span>

            <span class="msg-text" th:text="${message}"></span>

            <div class="progress-bar"></div>

            <span class="close-btn">&times;</span>
         </div>
      </div>

      <script th:src="@{/js/main.js}" defer></script>
   </body>
   </html>
