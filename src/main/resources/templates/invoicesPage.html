   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='settings')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Listes des factures validées</h1>
            <div class="date">
               <input type="date">
            </div>

            <div class="recent-orders">
               <div class="title-with-pack">
                  <a th:href="@{/settings}" class="back-icon">
                     <span><img src="/imgs/arrow_back.svg" alt=""></span>
                  </a>
               </div>
               <h2>Liste des factures</h2>
               <table>
                  <thead>
                     <tr>
                        <th>Id</th>
                        <th>Utilisateur</th>   
                        <th>Date</th>
                        <th></th>
                        <th></th>
                     </tr>
                  </thead>
                  <tbody>
                     <th:block th:each="invoice :${listInvoices}">
                        <tr>
                           <td>[[${invoice.idInvoice}]]</td>
                           <td>[[${invoice.user.id}]]</td>
                           <td th:text="${#temporals.format(invoice.dateVente, 'dd/MM/yyyy HH:mm')}"></td>
                           <!--<td>[[${invoice.pdfInvoice}]]</td>-->
                           <!--<td>
                              <a th:href="@{|/invoices/edit/${invoice.idInvoice}|}">
                                 <span class="edit-icon"><img src="/imgs/edit.svg" alt=""></span>
                              </a>
                           </td>-->
                           <td>
                              <a th:href="@{|/sales/pdf/${invoice.idInvoice}}" target="_blank">
                                 <span class="print-icon"><img src="/imgs/print.svg" alt=""></span>
                              </a>
                           </td>
                           <td>
                              <a th:href="@{|/invoices/delete/${invoice.idInvoice}|}">
                                 <span class="delete-icon"><img src="/imgs/do_not_disturb.svg" alt=""
                                 onclick="return confirm('Voulez-vous vraiment supprimer ce facture ?')"></span>
                              </a>
                           </td>
                        </tr>
                     </th:block>
                  </tbody>
               </table>
               <div class="item add-product" id="add-product-btn">
                 <!-- <div>
                     <a th:href="@{/addPurchase}">
                              <span class="material-icons-sharp">add</span>
                              <h3>Ajouter</h3>
                           </a>
                  </div>-->
               </div>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>

      <div th:if="${message}" id="notification-modal" class="modal-notification"
           th:classappend="${status == 'success' ? 'success' : 'error'}">

         <div class="modal-content">
        <span class="icon">
            <i class="material-icons-sharp" th:text="${status == 'success' ? 'message' : 'error'}"></i>
        </span>

            <span class="msg-text" th:text="${message}"></span>

            <div class="progress-bar"></div>

            <span class="close-btn">&times;</span>
         </div>
      </div>
      <script src="/js/main.js" defer></script>
   </body>
   </html>
