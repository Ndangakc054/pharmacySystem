   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pharmacie HUMANOPHAR</title>
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='sales')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Ventes et facturation</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="show-sale">
               <a class="sale-link" th:href="@{/recentSales}">
                  <!--<span><img src="/imgs/price_check.svg"></span>-->
                  <h3>Ventes validées</h3>
               </a>
            </div>
            <div class="stock-container">
               <div class="search-container">
                  <span class="search-icon" onclick="toggleSearch()"><img src="/imgs/search.svg"></span>
                     <input type="search" id="searchInput" class="search-input" placeholder="Recherchez ici..." onkeyup="filterTable()">
               </div>

               <table>
                  <thead>
                     <tr>
                        <th>Médicament</th>
                        <th>Prix unitaire</th>
                        <th>Quantité dans le stock</th>
                     </tr>
                  </thead>
                  <tbody id="tableBody">
                     <th:block th:each="stock :${listStock}">
                        <tr>
                           <td class="name">[[${stock.drug.nameDrug}]]</td>
                           <td>[[${stock.prixUnitaire}]]</td>
                           <td>[[${stock.quantity}]]</td>
                           <td>
                              <input type="hidden" name="drugId" th:value="${stock.drug.idDrug}" />
                              <span class="add-icon" onclick="addToInvoice(this)"><img src="/imgs/add_circle_outline.svg"></span>
                           </td>
                           <td>
                              <span class="cancel-icon" onclick="removeFromInvoiceByLeft(this)"><img src="/imgs/remove_circle_outline.svg"></span>
                           </td>
                        </tr>
                     </th:block>
                  </tbody>
               </table>
            </div> 
            <!---------------------- END OF INSIGTHS -------------------------->
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
            <!-- END OF TOP -->
            <!-- INVOICE -->
            <div class="invoice-container">
               <h2>Facture :</h2>
               <form id="salesForm">
                  <table>
                     <thead>
                        <tr>
                           <th>Name</th>
                           <th>Quantity</th>
                           <th>Unit_price</th>
                           <th>Total</th>
                        </tr>
                     </thead>
                     <tbody id="invoice-body">
                        <!--Place for drugs added-->
                     </tbody>
                     <tfoot>
                     <tr class="total-row">
                        <td colspan="2" class="total-label">TOTAL À PAYER :</td>
                        <td id="grand-total">0.00</td>
                        <td class="currency">Fbu</td>
                     </tr>
                     </tfoot>
                  </table>
                  <div class="invoice-info">
                     <p>
                        <strong>Utilisateur :</strong>
                        <span id="user-name" th:text="${loggedUser.nomUtilisateur}"></span>
                        <input type="hidden" id="user-id" th:value="${loggedUser.id}">
                     </p>
                     <p><strong>Date vente :</strong><span id="sale-date"></span></p>
                  </div>
                  <div class="invoice-buttons">
                     <button type="button" id="validate-invoice" onclick="return confirm('Voulez-vous vraiment valider cette facture ?')">
                        <span><img src="/imgs/check_circle.svg"></span>
                        <h3>Valider</h3>
                     </button>
                  </div>
               </form>
               
            </div>
            <div class="recent-updates"></div>
         </div>
      </div>
      <!--<script src="./assets/js/orders.js"></script>-->
      <script th:src="@{/js/main.js}"></script>
   </body>
   </html>
