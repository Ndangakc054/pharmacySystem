   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarUser(activeLink='orders')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Réquisition des médicaments</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="insigths"></div>
            <div class="stock-container">
               <div class="search-container">
                  <span class="search-icon" onclick="toggleSearch()"><img src="/imgs/search.svg" alt=""></span>
                     <input type="search" id="searchInput" class="search-input" placeholder="Recherchez ici..." onkeyup="filterTable()">
               </div>
               <table>
                  <thead>
                  <tr>
                     <th>Nom</th>
                     <th>Quantité</th>
                  </tr>
                  </thead>
                  <tbody id="stockTableBody">
                  <th:block th:each="stock :${listStock}">
                     <tr>
                        <td class="stock-name">[[${stock.drug.nameDrug}]]</td>
                        <td>[[${stock.quantity}]]</td>
                        <td>
                           <span class="add-icon" onclick="addToPurchaseList(this)"><img src="/imgs/add_circle_outline.svg"></span>
                        </td>
                        <td>
                           <span class="cancel-icon" onclick="removeFromPurchaseListByLeft(this)"><img src="/imgs/remove_circle_outline.svg"></span>
                        </td>
                     </tr>
                  </th:block>
                  </tbody>
               </table>
            </div> 
            <!---------------------- END OF INSIGTHS -------------------------->
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile" id="profileTrigger" style="cursor: pointer;">
                  <div class="info" th:if="${loggedUser != null}">
                     <p><b th:text="${loggedUser?.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser?.type}">Role</small>
                  </div>

                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>

                  <div id="user-popup" class="user-popup" style="display: none;" th:if="${loggedUser != null}">
                     <div class="popup-header">
                        <h3 th:text="${loggedUser.nomUtilisateur}">Nom</h3>
                        <p th:text="${loggedUser.type}">Role</p>
                     </div>
                     <hr>
                     <div class="popup-body">
                        <a th:href="@{/profile/edit/{id}(id=${loggedUser.Id})}" class="edit-link">
                           <span><img src="/imgs/manage_accounts.svg"></span>
                           Modifier votre profil
                        </a>
                     </div>
                  </div>
               </div>
            </div>
            <!-- END OF TOP -->
            <!-- ORDERS -->
            <div class="orders-container">
               <h2>Fiche de réquisition</h2>
               <form  id="ordersForm" >
                  <table>
                     <thead>
                     <tr>
                        <th>Name</th>
                        <th>Quantity</th>
                     </tr>
                     </thead>
                     <tbody id="orders-body">
                     <!-Place for drugs added-->

                     </tbody>
                  </table>
                  <div class="orders-buttons">
                     <button type="button" id="validate-file" onclick="return confirm('Voulez-vous vraiment valider ce fiche de réquisition ?')">
                        <span><img src="/imgs/check_circle.svg"></span>
                        <h3>Valider</h3>
                     </button>
                     <button type="button" id="clear-file">
                        <span><img src="/imgs/delete_sweep.svg"></span>
                        <h3>Vider</h3>
                     </button>
                  </div>
               </form>
            </div>
            <div class="recent-updates"></div>
         </div>
      </div>>
      <script th:src="@{/js/main.js}"></script>
   </body>
   </html>
