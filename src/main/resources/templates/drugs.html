   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='drugs')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Médicaments</h1>
            <div class="date">
               <input type="date">
            </div>

            <div class="stock-container">
               <div class="search-container">
                  <span class="search-icon" onclick="toggleSearch()"><img src="/imgs/search.svg"></span>
                     <input type="search" id="searchInput" class="search-input" placeholder="Recherchez ici..." onkeyup="filterTable()">
               </div>
            </div>

            <!--  ADD BUTTON -->
            <div class="button-container">
               <button class="action-button">
                  <a th:href="@{/addDrug}">Ajouter</a>
               </button>
            </div>

            <div class="recent-orders">
               <div class="filter-container">
                  <div class="table-title">
                     <h2>Listes des médicaments</h2>
                  </div>

                  <button class="action-button">
                     <a th:href="@{/drugs/export/excel}">Générer le fichier Excel</a>
                  </button>

                  <div class="status-filter">
                     <select id="categorySelect" onchange="filterByCategory()" class="form-control">
                        <option value="all">Tous les categories</option>
                        <option value="Aerosol">Aérosol</option>
                        <option value="Bandage">Bandage</option>
                        <option value="Collyre">Collyre</option>
                        <option value="Comprime">Comprimé</option>
                        <option value="ComprimeEffervescent">Comprimé effervescent</option>
                        <option value="Creme">Crème</option>
                        <option value="DispositifMedical">Dispositif médical</option>
                        <option value="Gel">Gel</option>
                        <option value="Gellule">Gélule</option>
                        <option value="GouttesAuriculaires">Gouttes auriculaires</option>
                        <option value="Implant">Implant</option>
                        <option value="Injection">Injection</option>
                        <option value="Ovule">Ovule</option>
                        <option value="Patch">Patch transdermique</option>
                        <option value="Perfusion">Perfusion</option>
                        <option value="Pommade">Pommade</option>
                        <option value="Sachet">Sachet</option>
                        <option value="Sirop">Sirop</option>
                        <option value="SolutionBuvable">Solution buvable</option>
                        <option value="SolutionCutanee">Solution cutanée</option>
                        <option value="SprayBuccal">Spray buccal</option>
                        <option value="SprayCutane">Spray cutané</option>
                        <option value="SprayNasal">Spray nasal</option>
                        <option value="Suppositoire">Suppositoire</option>
                     </select>
                  </div>
               </div>
               <table>
                  <thead>
                     <tr>
                        <th>Nom</th>
                        <th>Categorie</th>
                        <th>Unite de Mesure</th>
                        <th>Quantite/Unite</th>
                        <th></th> <th></th>
                     </tr>
                  </thead>
                  <tbody id="tableBody">
                     <th:block th:each="drug :${listDrugs}">
                        <tr>
                           <td class="name">[[${drug.nameDrug}]]</td>
                           <td>[[${drug.categorie}]]</td>
                           <td>[[${drug.uniteDeMesure}]]</td>
                           <td>[[${drug.quantiteParUnite}]]</td>
                           <td>
                              <a th:href="@{|drugs/edit/${drug.idDrug}|}">
                                 <span class="edit-icon">Éditer</span>
                              </a>
                           </td>
                           <td>
                              <a th:href="@{|/drugs/delete/${drug.idDrug}|}"
                                 onclick="return confirm('Voulez-vous vraiment supprimer ce médicament ?')">
                                 <span class="delete-icon">Supprimer</span>
                              </a>
                           </td>
                        </tr>
                     </th:block>
                  </tbody>
               </table>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>

      <div th:if="${message}" id="notification-modal" class="modal-notification"
           th:classappend="${status == 'success' ? 'success' : 'error'}">

         <div class="modal-content">
        <span class="icon">
            <i class="material-icons-sharp" th:text="${status == 'success' ? 'message' : 'error'}"></i>
        </span>

            <span class="msg-text" th:text="${message}"></span>

            <div class="progress-bar"></div>

            <span class="close-btn">&times;</span>
         </div>
      </div>

      <script src="/js/main.js" defer></script>
   </body>
   </html>
