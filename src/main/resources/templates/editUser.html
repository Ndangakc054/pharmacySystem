   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="/htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
          <div th:replace="~{fragments :: sidebarAdmin(activeLink='settings')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Utilisateurs</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="insigths">
               
            </div>
         <!-----------------FORM------------------>
            <div class="recent-orders">
               <div  id="addDrugForm" class="add-form">
                    <div class="form-content">
                     <div class="title-with-pack">
                        <a th:href="@{/users}" class="back-icon">
                           <span><img src="/imgs/arrow_back.svg" alt=""></span>
                        </a>
                        <!--<h2>Ajouter un nouveau médicaments</h2>-->
                     </div>
                       <form th:action="@{/users/update}" th:object="${user}" method="post" id="drugForm">
                        <!-- Champ caché pour transmettre l'Id -->
                        <input type="hidden" name="Id" th:field="*{Id}">  
                        <div class="form-group">
                           <label for="userName"> Nom:</label>
                           <input type="text" name="userName" id="userName" th:field="*{nomUtilisateur}" maxlength="45" required>
                        </div>
                        <div class="form-group">
                         <label for="userPassword">MotDePasse:</label>
                         <input type="text" name="userPassword" id="userPassword" th:field="*{MotDePasse}" maxlength="25" required>
                        </div>
                        <div class="form-group">
                           <label for="drugCategorie">Type:</label>
                           <select name="userType" id="userType" th:field="*{type}" maxlength="25" required>
                              <option value="ADMIN">Admin</option>
                              <option value="USER">Utilisateur</option>
                           </select>
                        </div>
                          <div class="submitBtn">
                             <button type="submit" id="submit-btn">Modifier</button>
                          </div>
                       </form>
                       </form>
                    </div>
                 </div>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>
      <!-- Modal -->
      <div id="modal" class="modal" 
      data-status="[[${status} ?: 'null']]" 
      data-message="[[${message} ?: '']]">
     <div class="modal-content">
         <span class="close" id="close-modal">&times;</span>
         <p id="modal-message"></p>
     </div>
     </div>
 
      <!-- Récuperation des données depuis thymeleaf -->
      <!--<div th:if="${status}" th:data-status="${status}" th:data-message="${message}"></div>-->
      <!-- Cette div sera ajoutée via RedirectAttributes -->
      <!--<div id="flash-data" th:if="${status != null and message != null}" th:data-status="${status}" th:data-message="${message}" style="display: none;">
         
       </div>--> 
      <!--<script src="./assets/js/orders.js"></script>-->
      <script src="/js/main.js" defer></script>
      <!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>-->
   </body>
   </html>
