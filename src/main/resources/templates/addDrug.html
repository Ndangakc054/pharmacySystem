   <!DOCTYPE html>
   <html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie HUMANOPHAR</title>
    <!-- ==== STYLESHEET === -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="/htp" rel="stylesheet">
   </head>

   <body>
      <div class="container">
         <div th:replace="~{fragments :: sidebarAdmin(activeLink='drugs')}"></div>
         <!---------------------- END OF ASIDE -------------------------->
         <main>
            <h1>Médicaments</h1>
            <div class="date">
               <input type="date">
            </div>
            <div class="insigths">
               
            </div>
         <!-----------------FORM------------------>
            <div class="recent-orders">
               <div  id="addDrugForm" class="add-form">
                    <div class="form-content">
                     <div class="title-with-pack">
                        <a th:href="@{/drugs}" class="back-icon">
                           <span><img src="/imgs/arrow_back.svg"></span>
                        </a>
                        <!--<h2>Ajouter un nouveau médicaments</h2>-->
                     </div>
                     <form action="/addDrug" method="post" th:object="${drug}" id="drugForm">
                        <!-- Ajoutez un champ caché pour l'ID si nécessaire -->
                        <input type="hidden" th:field="*{idDrug}" th:if="${drug.idDrug != null}">
                        <div class="form-group">
                           <label for="drugName"> Nom:</label>
                           <input type="text" name="drugName" id="drugName" th:field="*{nameDrug}" maxlength="45" required>
                        </div>
                        <div class="form-group">
                           <label for="drugCategorie">Categorie:</label>
                           <select name="drugCategorie" id="drugCategorie" th:field="*{categorie}" maxlength="25" required>
                              <option value=""></option>
                              <option value="Aerosol">Aérosol</option>
                              <option value="Bandage">Bandage</option>
                              <option value="Collyre">Collyre</option>
                              <option value="Comprime">Comprimé</option>
                              <option value="ComprimeEffervescent">Comprimé effervescent</option>
                              <option value="Creme">Crème</option>
                              <option value="DispositifMedical">Dispositif médical</option>
                              <option value="Gel">Gel</option>
                              <option value="Gellule">Gélule</option>
                              <option value="GouttesAuriculaires">Gouttes auriculaires</option>
                              <option value="Implant">Implant</option>
                              <option value="Injection">Injection</option>
                              <option value="Ovule">Ovule</option>
                              <option value="Patch">Patch transdermique</option>
                              <option value="Perfusion">Perfusion</option>
                              <option value="Pommade">Pommade</option>
                              <option value="Sachet">Sachet</option>
                              <option value="Sirop">Sirop</option>
                              <option value="SolutionBuvable">Solution buvable</option>
                              <option value="SolutionCutanee">Solution cutanée</option>
                              <option value="SprayBuccal">Spray buccal</option>
                              <option value="SprayCutane">Spray cutané</option>
                              <option value="SprayNasal">Spray nasal</option>
                              <option value="Suppositoire">Suppositoire</option>
                           </select>
                        </div>
                        <div class="form-group">
                           <label for="drugMeasure">Unité de mesure:</label>
                           <input type="text" name="drugMeasure" id="drugMeasure" th:field="*{uniteDeMesure}" maxlength="25" required>
                        </div>
                        <div class="form-group">
                           <label for="drugQuantity">Quantité par unité:</label>
                           <input type="number" name="drugQuantity" id="drugQuantity" step="1" min="0" max="200" th:field="*{quantiteParUnite}" maxlength="11" required>
                        </div>
                        <div class="submitBtn">
                           <button type="submit" id="submit-btn">Enregistrer</button>
                        </div>
                     </form>
                     </form>
                    </div>
                 </div>
            </div>
         </main>
         <!---------------------- END OF MAIN -------------------------->
         <div class="rigth">
            <div class="top">
               <button id="menu-btn">
                  <span class="material-icons-sharp">menu</span>
               </button>
               <div class="theme-toggler">
                  <span class="active"><img src="/imgs/light_mode.svg"></span>
                  <span><img src="/imgs/dark_mode.svg"></span>
               </div>
               <div class="profile">
                  <div class="info">
                     <p><b th:text="${loggedUser.nomUtilisateur}">Nom</b></p>
                     <small class="text-muted" th:text="${loggedUser.type}">Role</small>
                  </div>
                  <div class="profile-photo">
                     <img src="/imgs/profile-1.jpg" alt="">
                  </div>
               </div>
            </div>
       </div>
      </div>
      <!-- Modal -->
      <div id="modal" class="modal" 
      data-status="[[${status} ?: 'null']]" 
      data-message="[[${message} ?: '']]">
     <div class="modal-content">
         <span class="close" id="close-modal">&times;</span>
         <p id="modal-message"></p>
     </div>
     </div>
      <!--<script src="./assets/js/orders.js"></script>-->
      <script src="/js/main.js" defer></script>
      <!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>-->
   </body>
   </html>
